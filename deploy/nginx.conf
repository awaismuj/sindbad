# /etc/nginx/sites-available/sindbadsolution.com  (Certbot adds the 443 block)
server {
    listen 80;
    server_name sindbadsolution.com www.sindbadsolution.com;
    root /var/www/sindbad/client/dist;
    index index.html;
    client_max_body_size 5m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;   # match your PHP version
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/sindbad/server/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }
    location = /sitemap.xml {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/sindbad/server/public/index.php;
        fastcgi_param REQUEST_URI /sitemap.xml;
    }
    location /uploads/ { alias /var/www/sindbad/uploads/; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri /index.html; }   # React Router
}
